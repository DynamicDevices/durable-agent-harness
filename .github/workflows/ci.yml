name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy-and-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
          # Full private denylist is local-only; CI uses generic gates.
          DENYLIST_FILE: ""
