<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Dynamic Devices — modern box mark">
  <title>Dynamic Devices — hex box (concept v2)</title>
  <!-- Flat-top hex frame -->
  <polygon fill="none" stroke="#3D6B28" stroke-width="4" stroke-linejoin="round"
           points="64,14 108,39 108,89 64,114 20,89 20,39"/>
  <!-- Isometric cube -->
  <polygon fill="#D7E2EC" stroke="#F3F6F9" stroke-width="1.25" stroke-linejoin="round"
           points="64,38 88,52 64,66 40,52"/>
  <polygon fill="#7A8D9C" stroke="#F3F6F9" stroke-width="1.25" stroke-linejoin="round"
           points="40,52 64,66 64,94 40,80"/>
  <polygon fill="#6DB33F" stroke="#F3F6F9" stroke-width="1.25" stroke-linejoin="round"
           points="64,66 88,52 88,80 64,94"/>
  <!-- Live node -->
  <circle fill="#E88A3C" cx="88" cy="52" r="5"/>
  <path fill="none" stroke="#E88A3C" stroke-width="2.5" stroke-linecap="round" d="M64 66 L78 58"/>
</svg>
